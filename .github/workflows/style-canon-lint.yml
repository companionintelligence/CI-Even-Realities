name: Style canon lint

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on: [pull_request, push]
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'
      # ci-lint-canon (@companionintelligence/config) reads the canon from the tokens package
      - run: npm ci
        working-directory: ci-glasses-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint:canon
        working-directory: ci-glasses-app
