name: Deploy er-connect (Cloudflare Workers static assets)

# Gated like ci.yml — see docs/CI.md. Dispatch manually:
#   gh workflow run deploy-er-connect.yml --repo companionintelligence/CI-Even-Realities --ref main
#
# ci-er-connect is a Worker with static assets (er-connect/wrangler.jsonc),
# not a classic Cloudflare Pages project — `wrangler pages deploy` will fail
# against it with "The Pages project ... does not exist". Deploy with plain
# `wrangler deploy`, which reads the name/assets(dist/)/routes straight from
# that config file instead of CLI flags. er-connect is a real Vite + React
# app now (@companionintelligence/ui), so it needs an install + build step
# before wrangler can see anything in dist/.
#
# Needs two repo secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see
# er-connect/README.md). The first step fails fast, with that message, when they
# are missing. wrangler 4 is required: the assets-only wrangler.jsonc has no
# `main`, which wrangler 3.x (what wrangler-action installs by default) rejects
# with "Missing entry-point".
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish er-connect/ to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: er-connect
    steps:
      # Runs before checkout, so er-connect/ does not exist yet: override the job's
      # default working directory or bash cannot even start.
      - name: Check Cloudflare credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare secrets missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions (see er-connect/README.md, Deploy). Until then, redeploy locally: cd er-connect && npm run build && npx wrangler deploy"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: er-connect/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GA4 is injected at build time by er-connect/vite.config.ts, and only
      # when the repo variable is a valid G-… ID (unset => nothing emitted).
      #   gh variable set GA_MEASUREMENT_ID --body G-XXXX --repo companionintelligence/CI-Even-Realities
      - name: Build
        run: npm run build
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: er-connect
          command: deploy

      # A green deploy is not proof the site changed (this one sat stale for a
      # while). Fetch the live page and assert the cross-links are in it.
      - name: Verify the live site
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL --max-time 20 https://er.ci.computer/ || true)"
            if printf '%s' "$html" | grep -q 'href="https://ci.computer/core"' \
              && printf '%s' "$html" | grep -q 'href="https://ci.computer/download"' \
              && curl -fsS --max-time 20 -o /dev/null https://er.ci.computer/robots.txt; then
              echo "Live site serves the new build."
              exit 0
            fi
            echo "Attempt $attempt: live site does not show the new build yet; retrying in 10s"
            sleep 10
          done
          echo "::error title=Live site is stale::https://er.ci.computer/ does not contain the Buy/Download links after deploy."
          exit 1
