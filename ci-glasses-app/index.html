<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: restrict script execution to same-origin only.
         style-src 'unsafe-inline' is required for Vite's injected style tags.
         connect-src 'self' allows the app to call its configured AI backend;
         wildcard (*) is needed here because the backend URL is user-configurable. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src 'self' data:" />
    <title>CI Companion — Even G2</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕶️</text></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/Main.ts"></script>
  </body>
</html>
