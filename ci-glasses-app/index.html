<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#041620" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Content Security Policy: restrict script execution to same-origin only.
         style-src 'unsafe-inline' is required for Vite's injected style tags.
         connect-src * allows the app to call its configured AI backend;
         wildcard (*) is needed here because the backend URL is user-configurable. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src 'self' data:" />
    <title>CI Companion — Even G2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <img class="splash__mark" src="/icon.png" alt="" width="96" height="96" />
      <div class="splash__title">CI Companion</div>
      <div class="splash__sub">connecting…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/Main.ts"></script>
  </body>
</html>
